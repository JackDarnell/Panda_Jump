name: iOS Simulator

# Builds the app with the latest Xcode and plays through it in the iOS Simulator
# using the UI test in "Panda JumpUITests". Screenshots are uploaded as an artifact.

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  simulator:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode and simulator runtimes
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Pick the newest iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = [r for r in devices if ".iOS-" in r]
          runtimes.sort(key=lambda r: [int(x) for x in r.split(".iOS-")[-1].split("-")])
          for runtime in reversed(runtimes):
              phones = [d for d in devices[runtime] if d["name"].startswith("iPhone")]
              pros = [d for d in phones if "Pro" in d["name"]]
              if phones:
                  print((pros or phones)[-1]["udid"])
                  break
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID"

      - name: Build and run UI tests in the simulator
        run: |
          status=0
          xcodebuild test \
            -project "Panda Jump.xcodeproj" \
            -scheme "Panda Jump" \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO > xcodebuild.log 2>&1 || status=$?
          grep -E "error:|warning: .*\.swift|Test Case|Executed|\*\* (BUILD|TEST)" xcodebuild.log | tail -300 || true
          exit $status

      - name: Export screenshots
        if: always()
        run: |
          mkdir -p screenshots crash-logs
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path TestResults.xcresult --output-path screenshots || true
          fi
          cp ~/Library/Logs/DiagnosticReports/*Panda* crash-logs/ 2>/dev/null || true
          ls -la screenshots crash-logs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-results
          path: |
            screenshots
            crash-logs
            xcodebuild.log
